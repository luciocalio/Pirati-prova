<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Telecomando pirata</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
html,body{margin:0;height:100%;width:100%;position:fixed;inset:0;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;background:#0d1b2e;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#join{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;padding:24px;text-align:center}
#join h1{margin:0;font-size:26px}
#join p{margin:0;color:#9db4d0;font-size:15px}
input{font:inherit;font-size:22px;text-align:center;padding:12px;border-radius:12px;border:2px solid #2d4a6e;background:#14263d;color:#fff;width:230px;text-transform:uppercase;touch-action:auto;-webkit-user-select:text;user-select:text}
button.go{font:inherit;font-weight:700;font-size:20px;padding:14px 40px;border:0;border-radius:14px;background:#ff9d2e;color:#2a1600}
#err{color:#ff8a8a;min-height:20px;font-size:14px}
#pad{position:fixed;inset:0;display:none}
#stick{position:absolute;left:5vw;bottom:9vh;width:52vh;height:52vh;max-width:260px;max-height:260px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.22)}
#knob{position:absolute;width:42%;height:42%;left:29%;top:29%;border-radius:50%;background:rgba(255,255,255,.45);border:2px solid rgba(255,255,255,.7)}
.b{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:.04em;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);color:#fff}
.b.on{background:rgba(255,255,255,.4);transform:scale(.96)}
#atk{right:4vw;bottom:7vh;width:44vh;height:44vh;background:rgba(255,90,70,.35);border-color:#ff7a66;font-size:min(5.2vh,24px)}
#rum,#bmb{bottom:calc(7vh + 44vh + 3vh);width:18vh;height:18vh;font-size:min(3vh,14px)}
#rum{right:4vw;border-color:#8fe3a8;background:rgba(143,227,168,.18)}
#bmb{right:calc(4vw + 20vh);border-color:#ffb347;background:rgba(255,179,71,.2)}
#cp{position:fixed;inset:0;display:none;background:rgba(8,10,26,.88);z-index:5;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:10px}
#cp h2{margin:0;font-size:min(5vh,22px)}
#cp .row{display:flex;gap:12px;width:100%;max-width:760px;height:62vh}
#cp .cd{flex:1;border-radius:14px;border:3px solid #ffd25a;background:#1a1530;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center}
#cp .cd:active{background:#3a2f66}
#cp .cd b{font-size:min(4.6vh,20px)}#cp .cd span{font-size:min(3.4vh,14px);opacity:.85}
#cp .tm{width:60%;height:6px;background:rgba(255,255,255,.2);border-radius:3px;overflow:hidden}#cp .tm div{height:100%;background:#ffd25a;width:100%}
#dod{right:calc(4vw + 44vh + 5vh);bottom:3vh;width:32vh;height:32vh;font-size:min(4vh,19px)}
#lck{right:calc(4vw + 44vh + 2vh);bottom:calc(3vh + 32vh + 5vh);width:26vh;height:26vh;font-size:min(3.6vh,17px)}
#cl,#cr{top:5vmin;width:14vmin;height:14vmin;min-width:60px;min-height:60px;max-width:86px;max-height:86px;font-size:22px;border-radius:16px}
#cl{left:42%}#cr{left:calc(42% + max(16vmin,72px))}
#st{position:absolute;top:8px;left:12px;font-size:12px;color:#9db4d0}
#sl{position:fixed;inset:0;display:none;z-index:6;background:#0d1b2e;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px}
#sl h2{margin:0;font-size:min(5.5vh,24px)}
#sl .row{display:flex;gap:12px;width:100%;max-width:820px;height:62vh}
#sl .opt{flex:1;border-radius:16px;border:4px solid var(--c,#fff);background:color-mix(in srgb,var(--c,#fff) 22%,#0d1b2e);color:#fff;font:inherit;font-weight:800;font-size:min(4.4vh,19px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px;text-align:center}
#sl .opt small{font-weight:600;font-size:min(3vh,13px);opacity:.85}
#sl .opt:active{filter:brightness(1.4)}
#sl .opt.off{opacity:.3;filter:grayscale(1);pointer-events:none}
#sl .opt.big{font-size:min(7vh,30px)}
#sl .sm{font:inherit;font-size:16px;padding:10px 18px;border-radius:12px;border:2px solid #2d4a6e;background:#14263d;color:#fff}
#rot{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0d1b2eee;text-align:center;font-size:20px;z-index:5;padding:30px}
@media (orientation:portrait){#rot.need{display:flex}}
</style></head><body>
<div id="join">
  <h1>🏴‍☠️ Telecomando</h1>
  <p>Scrivi il codice che vedi sullo schermo del PC</p>
  <input id="code" maxlength="4" placeholder="CODICE" autocomplete="off" autocapitalize="characters">
  <button class="go" id="go">ENTRA</button>
  <div id="err"></div>
</div>
<div id="pad">
  <div id="st"></div>
  <div id="stick"><div id="knob"></div></div>
  <div class="b" id="cl">◀</div><div class="b" id="cr">▶</div>
  <div class="b" id="lck">MIRA</div>
  <div class="b" id="dod">SCHIVA</div>
  <div class="b" id="atk">ATTACCO</div>
  <div class="b" id="rum">RUM</div><div class="b" id="bmb">BOMBA</div>
</div>
<div id="sl"></div>
<div id="cp"><h2>Scegli una carta!</h2><div class="row" id="cprow"></div><div class="tm"><div id="cptm"></div></div></div>
<div id="rot" class="need">Gira il telefono in orizzontale 📱↻</div>
<script>
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
$('code').value=(qs.get('c')||localStorage.getItem('pcode')||'').toUpperCase().slice(0,4);
let ws=null, lat=0, started=false;
let weapon='sword';
let pc=null, dc=null;
function direct(){ return dc&&dc.readyState==='open'; }
function send(m){ const j=JSON.stringify(m); if(direct()){ dc.send(j); return; } if(ws&&ws.readyState===1) ws.send(j); }
function rtcOffer(d){
  try{
    if(pc){ try{pc.close();}catch(e){} }
    pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]}); dc=null;
    pc.ondatachannel=e=>{ dc=e.channel; dc.onmessage=ev=>handleMsg(JSON.parse(ev.data)); dc.onclose=()=>{ dc=null; }; };
    pc.onicecandidate=e=>{ if(e.candidate&&ws&&ws.readyState===1) ws.send(JSON.stringify({t:'rtc',d:{ice:e.candidate}})); };
    pc.setRemoteDescription(d.sdp).then(()=>pc.createAnswer()).then(a=>pc.setLocalDescription(a)).then(()=>{ ws.send(JSON.stringify({t:'rtc',d:{sdp:pc.localDescription}})); }).catch(()=>{});
  }catch(e){}
}
function connect(){
  const code=$('code').value.trim().toUpperCase(), name='Pirata';
  if(code.length!==4){ $('err').textContent='Il codice ha 4 lettere'; return; }
  try{ localStorage.setItem('pcode',code); }catch(e){}
  $('err').textContent='Mi collego…';
  const proto=location.protocol==='https:'?'wss:':'ws:';
  ws=new WebSocket(`${proto}//${location.host}/ws?role=pad&code=${code}&name=${encodeURIComponent(name)}&w=${weapon}`);
  ws.onmessage=ev=>handleMsg(JSON.parse(ev.data));
  ws.onclose=()=>{ if(started){ $('st').textContent='Connessione persa… riprovo'; setTimeout(()=>{ if(started) connect(); },1200);} };
}
function handleMsg(m){
  {
    if(m.t==='rtc'&&m.d){ if(m.d.sdp) rtcOffer(m.d); else if(m.d.ice&&pc) pc.addIceCandidate(m.d.ice).catch(()=>{}); return; }
    if(m.t==='ok'){ $('join').style.display='none'; $('pad').style.display='block'; started=true; tryFull(); }
    else if(m.t==='err'){ $('err').textContent=m.msg; }
    else if(m.t==='cards'){ showCards(m); }
    else if(m.t==='sel'){ showSel(m); }
    else if(m.t==='hurt'){ if(navigator.vibrate) navigator.vibrate(120); }
    else if(m.t==='hit'){ if(navigator.vibrate) navigator.vibrate(25); }
    else if(m.t==='vib'){ if(navigator.vibrate) navigator.vibrate(m.p); }
    else if(m.t==='pong'){ lat=Math.round(performance.now()-m.c); $('st').textContent='ritardo '+lat+' ms'+(direct()?' (diretto)':''); }
  }
}
$('go').onclick=connect;
function tryFull(){ try{ document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{}); screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} try{ navigator.wakeLock&&navigator.wakeLock.request('screen'); }catch(e){} }
setInterval(()=>send({t:'ping',c:performance.now()}),2000);
const rot=$('rot'); const chk=()=>{ rot.className = (innerHeight>innerWidth && started)?'need':''; rot.style.display=(innerHeight>innerWidth && started)?'flex':'none'; }; addEventListener('resize',chk); chk();

// joystick
const stick=$('stick'), knob=$('knob'); let sid=null, last='';
function setStick(e){
  const r=stick.getBoundingClientRect(), R=r.width/2;
  let dx=e.clientX-(r.left+R), dy=e.clientY-(r.top+R); const l=Math.hypot(dx,dy), max=R*0.85;
  if(l>max){dx=dx/l*max;dy=dy/l*max;}
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  let x=dx/max, y=-dy/max; const m=Math.hypot(x,y); if(m<0.15){x=0;y=0;}
  const s=x.toFixed(2)+','+y.toFixed(2); if(s!==last){ last=s; send({t:'mv',x:+x.toFixed(2),y:+y.toFixed(2)}); }
}
stick.addEventListener('pointerdown',e=>{ sid=e.pointerId; stick.setPointerCapture(sid); setStick(e); });
stick.addEventListener('pointermove',e=>{ if(e.pointerId===sid) setStick(e); });
const endStick=e=>{ if(e.pointerId!==sid) return; sid=null; knob.style.transform=''; last='0.00,0.00'; send({t:'mv',x:0,y:0}); };
stick.addEventListener('pointerup',endStick); stick.addEventListener('pointercancel',endStick);

const PN=[['Alicca muddicu','rosso','#ff6a5a'],['Rusica ossa','verde','#5fdc84'],['Spazzolina','giallo','#ffd25a'],['Tana a pazza','viola','#c48bff']];
function showSel(m){
  const sl=$('sl');
  if(!m.on){ sl.style.display='none'; if(m.w){ weapon=m.w; if(weapon==='gun'){ $('atk').textContent='SPARA'; $('atk').style.background='rgba(255,210,90,.3)'; $('atk').style.borderColor='#ffd25a'; } } return; }
  const act=a=>send(Object.assign({t:'sel'},a));
  sl.style.display='flex'; sl.innerHTML='';
  const h=document.createElement('h2'), row=document.createElement('div'); row.className='row';
  const mk=(txt,sub,c,fn,cls)=>{ const b=document.createElement('button'); b.className='opt'+(cls?' '+cls:''); b.style.setProperty('--c',c); b.innerHTML=txt+(sub?'<small>'+sub+'</small>':''); b.onclick=fn; row.appendChild(b); return b; };
  if(m.lock){
    const P=PN[m.me]||PN[0]; h.textContent='Sei pronto!';
    mk(P[0],(m.w==='gun'?'REVOLVER':'SPADA')+' · aspetta gli altri',P[2],()=>{},'big');
    sl.append(h,row); const c=document.createElement('button'); c.className='sm'; c.textContent='Cambia'; c.onclick=()=>act({a:'back'}); sl.appendChild(c);
  } else if(m.step){
    const P=PN[m.me]||PN[0]; h.textContent=P[0]+': scegli l\'arma';
    mk('⚔️ SPADA','corpo a corpo',P[2],()=>act({a:'wpn',w:'sword'}),'big');
    mk('🔫 REVOLVER','a distanza',P[2],()=>act({a:'wpn',w:'gun'}),'big');
    sl.append(h,row); const c=document.createElement('button'); c.className='sm'; c.textContent='◀ cambia pirata'; c.onclick=()=>act({a:'back'}); sl.appendChild(c);
  } else {
    h.textContent='Scegli il tuo pirata';
    PN.forEach((P,i)=>{ const b=mk(P[0],m.taken&&m.taken[i]?'preso':P[1],P[2],()=>act({a:'pick',s:i})); if(m.taken&&m.taken[i]) b.classList.add('off'); });
    sl.append(h,row);
  }
}
let cpTimer=null;
function showCards(m){
  const cp=$('cp'); clearInterval(cpTimer);
  if(!m.c){ cp.style.display='none'; return; }
  const row=$('cprow'); row.innerHTML='';
  m.c.forEach((c,i)=>{ const d=document.createElement('div'); d.className='cd'; d.innerHTML='<b></b><span></span>'; d.children[0].textContent=c.n; d.children[1].textContent=c.d;
    d.addEventListener('pointerdown',e=>{ e.preventDefault(); send({t:'k',k:'Digit'+(i+1),d:1}); setTimeout(()=>send({t:'k',k:'Digit'+(i+1),d:0}),60); cp.style.display='none'; clearInterval(cpTimer); if(navigator.vibrate) navigator.vibrate(15); });
    row.appendChild(d); });
  cp.style.display='flex'; const t0=performance.now();
  cpTimer=setInterval(()=>{ const f=1-(performance.now()-t0)/m.ms; $('cptm').style.width=Math.max(0,f*100)+'%'; if(f<=0){ clearInterval(cpTimer); cp.style.display='none'; } },100);
  if(navigator.vibrate) navigator.vibrate([40,40,40]);
}
// pulsanti
function btn(id,key,hold){
  const el=$(id); let pid=null;
  el.addEventListener('pointerdown',e=>{ pid=e.pointerId; el.setPointerCapture(pid); el.classList.add('on'); send({t:'k',k:key,d:1}); if(!hold) setTimeout(()=>send({t:'k',k:key,d:0}),60); if(navigator.vibrate&&!hold) navigator.vibrate(8); });
  const up=e=>{ if(e.pointerId!==pid) return; pid=null; el.classList.remove('on'); if(hold) send({t:'k',k:key,d:0}); };
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
}
btn('atk','KeyJ'); btn('rum','KeyH'); btn('bmb','KeyG'); btn('dod','Space'); btn('lck','Tab'); btn('cl','KeyQ',true); btn('cr','KeyE',true);

// ---- blocco gesti: niente scroll, zoom, ricarica, menu, tasto indietro
const guard=e=>{ if(started) e.preventDefault(); };
document.addEventListener('touchstart',e=>{ if(started && e.target.tagName!=='INPUT') e.preventDefault(); },{passive:false});
document.addEventListener('touchmove',guard,{passive:false});
document.addEventListener('touchend',e=>{ if(started) e.preventDefault(); },{passive:false});
['gesturestart','gesturechange','gestureend','dblclick','selectstart','dragstart'].forEach(n=>document.addEventListener(n,e=>e.preventDefault()));
document.addEventListener('wheel',guard,{passive:false});
history.pushState({p:1},'',location.href);
addEventListener('popstate',()=>{ history.pushState({p:1},'',location.href); });
addEventListener('beforeunload',e=>{ if(started){ e.preventDefault(); e.returnValue=''; } });
document.addEventListener('contextmenu',e=>e.preventDefault());

</script></body></html>
