<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Il Porto</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8cc8ff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #hud { display: none; pointer-events: none; }
  .tl { position: fixed; top: 16px; left: 18px; font-weight: 800; letter-spacing: .04em; text-shadow: 0 2px 4px rgba(0,0,0,.55); }
  #found { font-size: 15px; background: rgba(14,12,30,.7); border: 2px solid rgba(255,255,255,.25); border-radius: 10px; padding: 7px 12px; display: inline-block; }
  #gold { position: fixed; top: 16px; right: 22px; font-weight: 800; font-size: 20px; display: flex; align-items: center; gap: 7px; color: #ffd25a; text-shadow: 0 2px 4px rgba(0,0,0,.55); }
  .coin { display: inline-block; width: 15px; height: 15px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff1a8, #e0a21d 60%, #a66c0c); border: 2px solid #1b1224; }
  #mini { position: fixed; right: 18px; bottom: 18px; width: 200px; height: 171px; border: 2px solid rgba(255,255,255,.35); border-radius: 12px; }
  #prompt { position: fixed; left: 50%; bottom: 14vh; transform: translateX(-50%); background: rgba(14,12,30,.82); border: 2px solid rgba(255,255,255,.3); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 16px; display: none; white-space: nowrap; }
  #prompt b { background: #ffd25a; color: #1b1224; border-radius: 6px; padding: 1px 8px; margin-right: 8px; }
  #toast { position: fixed; left: 50%; top: 14vh; transform: translate(-50%, -8px); background: rgba(14,12,30,.85); border: 2px solid #ffd25a; padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 16px; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: 80vw; text-align: center; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #help { position: fixed; left: 18px; bottom: 16px; font-size: 12px; line-height: 1.6; opacity: .85; background: rgba(14,12,30,.6); padding: 8px 12px; border-radius: 10px; }
  #help b { color: #ffd25a; }
  #back { position: fixed; top: 62px; left: 18px; pointer-events: auto; color: #fff; font-weight: 700; font-size: 13px; text-decoration: none; background: rgba(14,12,30,.7); border: 2px solid rgba(255,255,255,.25); border-radius: 10px; padding: 6px 12px; }
  #floaters { position: fixed; inset: 0; pointer-events: none; }
  .fl { position: absolute; transform: translate(-50%, -50%); font-weight: 800; font-size: 22px; color: #ffd25a; text-shadow: 0 2px 0 #1b1224; animation: up .9s ease-out forwards; }
  .fl.big { font-size: 34px; }
  @keyframes up { from { opacity: 1; margin-top: 0; } to { opacity: 0; margin-top: -50px; } }
  .bub { position: fixed; transform: translate(-50%, -100%); background: #fff; color: #1b1224; padding: 7px 12px; border-radius: 12px; font-weight: 600; font-size: 14px; max-width: 240px; text-align: center; border: 2px solid #1b1224; display: none; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; align-items: center; justify-content: flex-start; padding-top: 7vh !important; flex-direction: column; gap: 14px; background: linear-gradient(rgba(10,12,30,.15), rgba(8,8,24,.65)); text-align: center; padding: 20px; }
  #start h1 { margin: 0; font-size: clamp(36px, 7vw, 68px); letter-spacing: .06em; text-shadow: 0 4px 0 #1b1224, 0 0 24px rgba(0,0,0,.4); }
  #start p { margin: 0; opacity: .92; font-size: 16px; max-width: 460px; line-height: 1.5; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  #start button { font: inherit; font-weight: 800; font-size: 20px; padding: 14px 40px; border-radius: 14px; border: 3px solid #1b1224; background: #ffd25a; color: #1b1224; cursor: pointer; }
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="floaters"></div>
<div id="hud">
  <div class="tl"><span id="found"></span></div>
  <div id="gold"></div>
  <canvas id="mini" width="200" height="171"></canvas>
  <div id="prompt"></div>
  <div id="toast"></div>
  <div id="help"><b>WASD</b> muovi · <b>Shift</b> corri · <b>Spazio</b> salta · <b>E</b> interagisci · <b>Q/R</b> o trascina ruota camera · <b>rotella</b> zoom</div>
  <a id="back" href="/">← Torna al gioco</a>
</div>
<div id="start">
  <h1>IL PORTO</h1>
  <p>Gira per le strade, cerca nei barili, spingi le casse, suona la campana. Qualche forziere è nascosto bene.</p>
  <button id="startBtn">ENTRA</button>
</div>
